workflows:
  android_debug_apk:
    name: NovaStream Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Ensure Flutter platform projects exist
        script: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios,macos,windows .
          fi
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  android_release:
    name: NovaStream Android Release AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - novastream_build_secrets
    scripts:
      - name: Ensure Android project exists
        script: |
          if [ ! -d android ]; then flutter create --platforms=android .; fi
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  ios_release:
    name: NovaStream iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - novastream_build_secrets
    scripts:
      - name: Ensure iOS project exists
        script: |
          if [ ! -d ios ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi
      - name: Install dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build IPA
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
