workflows:
  android_debug_apk:
    name: NovaStream Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android runner
        script: |
          set -e
          if [ ! -f android/settings.gradle ]; then
            flutter create \
              --project-name novastream_player \
              --org com.novastream \
              --platforms=android \
              .
          fi
      - name: Verify Android runner
        script: |
          set -e
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  android_release:
    name: NovaStream Android Release AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - novastream_build_secrets
    scripts:
      - name: Generate Android runner
        script: |
          set -e
          if [ ! -f android/settings.gradle ]; then
            flutter create \
              --project-name novastream_player \
              --org com.novastream \
              --platforms=android \
              .
          fi
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  ios_release:
    name: NovaStream iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - novastream_build_secrets
    scripts:
      - name: Generate iOS runner
        script: |
          set -e
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create \
              --project-name novastream_player \
              --org com.novastream \
              --platforms=ios \
              .
          fi
      - name: Install dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build IPA
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
